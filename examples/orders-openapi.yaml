openapi: 3.0.3
info:
  title: Sample Orders API
  version: 1.0.0
  description: Fictional API contract used by the AI API Self-Healing QE Copilot demo.
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerEmail, amount]
              properties:
                customerEmail:
                  type: string
                  format: email
                  example: qa@example.com
                amount:
                  type: number
                  minimum: 1
                  maximum: 50000
                  example: 2599
                currency:
                  type: string
                  enum: [USD, EUR, INR]
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                      status:
                        type: string
        '400':
          description: Invalid request
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Retrieve an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                      status:
                        type: string
                      customer:
                        type: object
                        properties:
                          customerId:
                            type: string
        '404':
          description: Order not found

